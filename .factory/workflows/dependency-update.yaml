schema_version: v1
name: dependency-update-potteryshop
enabled: true

trigger:
  cron:
    schedule: "0 21 * * *"
    timezone: "America/Chicago"
    overlap_policy: skip
    timeout: 2h

enable_manual_trigger: true

tags: ["cron", "dependencies"]
color: cyan

stages:
  - id: start
    label: Start
    entry: true
    on_enter:
      inject: |
        Workflow task: run the Go dependency update maintenance workflow for Pottery Shop.

        This is an unattended dependency maintenance workflow. Do not ask for
        permission to start. First, prepare the target branch:

        - Check for an open PR with title "[deps] Dependency update: go" or branch "deps/dependency-update-go".
        - If an open PR exists, fetch its branch, rebase it onto the current base branch, and check it out.
        - If no open PR exists, create and check out a new branch named "deps/dependency-update-go".

        Then say exactly [PROCEED] so the workflow can run the dependency
        updater, then continue with the task using the follow-up instructions.

        After the PR is open, the workflow will wait for GitHub CI checks to
        finish, retry any failed GitHub Actions jobs once, and surface the logs
        if they still fail. You must then fix the failures and say [DONE] again.

  - id: working
    label: Working
    triggers:
      - message_contains: "[PROCEED]"
    on_enter:
      run:
        command: |
          bash -lc '
            set -euo pipefail

            go_path="$(command -v go)"
            go_version="$(go version)"
            printf "{\"status\":\"ready\",\"go_path\":\"%s\",\"go_version\":\"%s\"}\n" "$go_path" "$go_version"
          '
        output: go_toolchain
        timeout: 10m
      dependency_updates:
        ecosystems: [go]
        paths: ["."]
        output: dependency_updates
        timeout: 30m
        continue_on_error: true
      inject: |
        Dependency updates were applied for the root Go module.

        Scope this workflow to Go dependency updates only. Focus on the
        top-level go.mod/go.sum. Exclude Node dependencies and any non-Go
        modules.

        Treat compatibility fixes as part of this workflow. If an updated
        dependency causes build, lint, type, or test failures, first attempt
        reasonable scoped code changes within the affected Go module to support
        the new version. Do not downgrade, pin, or skip an update just because
        it has breaking API changes unless the required changes are broad,
        risky, unrelated to this workflow's scope, or cannot be completed within
        reasonable effort. If you defer an update, explain exactly why.

        Review {{ .Outputs.dependency_updates.files_changed }}.
        Before opening a PR, validate using the repo make targets in the Nix
        development environment (nix develop -c). Do not run ad-hoc go
        commands; use exactly these targets:

        - cd pottery-shop && make build
        - cd pottery-shop && make test

        Note: make test-integration requires a Kubernetes cluster. Only add it
        to the validation if the workflow environment provides one.

        Fix any failures and open one grouped PR.
        Say [DONE] with the PR URL only when the PR is open.
        If {{ .Outputs.dependency_updates.files_changed }} is empty and no PR is
        needed, say [NO_CHANGES] instead of [DONE].

  - id: no-changes
    label: No Changes
    triggers:
      - message_contains: "[NO_CHANGES]"
      - message_contains: "[DONE] No changes"
    terminal: true

  - id: validate
    label: Validate
    triggers:
      - message_contains: "[DONE]"
    on_enter:
      run:
        command: |
          bash -lc '
            set +e
            tmpdir="$(mktemp -d)"

            make build >"$tmpdir/build.log" 2>&1
            build_status=$?

            make test >"$tmpdir/test.log" 2>&1
            test_status=$?

            python3 - "$tmpdir" "$build_status" "$test_status" <<PY
          import json
          import pathlib
          import sys

          tmpdir = pathlib.Path(sys.argv[1])
          statuses = {
              "build": int(sys.argv[2]),
              "test": int(sys.argv[3]),
          }

          checks = []
          for name, code in statuses.items():
              log = (tmpdir / f"{name}.log").read_text(errors="replace")
              checks.append({
                  "name": name,
                  "status": "passed" if code == 0 else "failed",
                  "exit_code": code,
                  "log_tail": log[-12000:],
              })

          failed = [check for check in checks if check["exit_code"] != 0]
          print(json.dumps({
              "status": "passed" if not failed else "failed",
              "reason": "all validation checks passed" if not failed else "one or more validation checks failed",
              "checks": checks,
          }))
          PY
          '
        output: validation
        timeout: 45m
    gate:
      output: validation
      pass:
        path: status
        values: [passed]
      fail:
        path: status
        values: [failed, error]
      required: true

  - id: fix-validation
    label: Fix Validation
    triggers:
      - gate_result:
          stage: validate
          verdict: fail
    on_enter:
      inject: |
        Validation failed before completion.

        Status: {{ .Outputs.validation.status }}
        Reason: {{ .Outputs.validation.reason }}

        Checks:
        {{ .Outputs.validation.checks }}

        Fix the failures above, commit the changes to the same PR branch, and
        say [DONE] with the PR URL again when the PR is ready for validation.

  - id: wait-for-ci
    label: Wait for CI
    triggers:
      - gate_result:
          stage: validate
          verdict: pass
    on_enter:
      run:
        command: |
          bash -lc '
            set -euo pipefail

            if ! command -v gh >/dev/null 2>&1; then
                echo "{\"status\": \"error\", \"reason\": \"gh CLI is not available\"}"
                exit 1
            fi

            if ! gh auth status >/dev/null 2>&1; then
                echo "{\"status\": \"error\", \"reason\": \"gh CLI is not authenticated\"}"
                exit 1
            fi

            python3 scripts/wait_for_pr_ci.py --repo-dir kots --branch deps/dependency-update-go
          '
        output: ci_status
        timeout: 120m
    gate:
      output: ci_status
      pass:
        path: status
        values: [passed]
      fail:
        path: status
        values: [failed, error]
      required: true

  - id: fix-ci
    label: Fix CI Failures
    triggers:
      - gate_result:
          stage: wait-for-ci
          verdict: fail
    on_enter:
      inject: |
        GitHub CI checks failed and the automatic retry did not resolve them.

        PR: {{ .Outputs.ci_status.pr_url }}
        Status: {{ .Outputs.ci_status.status }}
        Failed checks:
        {{ .Outputs.ci_status.checks }}

        Retried GitHub Actions runs:
        {{ .Outputs.ci_status.retried }}

        Log tails from the retried failed jobs:
        {{ .Outputs.ci_status.logs }}

        Read the logs, identify the root cause of the failures, and make
        reasonable scoped fixes in the PR branch (under kots/ when the issue
        is in the Go code). Commit and push the fixes to the same branch.

        If the failures are clearly unrelated to the dependency update (for
        example, an infrastructure or flaky CI issue that you cannot resolve
        from the code), or if you have tried to fix them and the failures persist,
        explain why and say exactly [CI FAILED] to stop the workflow instead of
        looping indefinitely.

        When the fixes are pushed and the PR is ready, say [DONE] with the PR
        URL again so the workflow re-runs the local validation and monitors CI.

  - id: ci-failed
    label: CI Failed
    triggers:
      - message_contains: "[CI FAILED]"
    terminal: true

  - id: complete
    label: Complete
    triggers:
      - gate_result:
          stage: wait-for-ci
          verdict: pass
    terminal: true
