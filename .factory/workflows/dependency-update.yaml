schema_version: 2
name: dependency-update-potteryshop
enabled: true
manual_trigger: true

initial_state: prepare

trigger:
  cron:
    schedule: "0 9 * * 1"        # Mondays at 09:00 UTC
    timezone: "UTC"
    overlap_policy: skip         # skip if a previous run is still active
    timeout: "2h"                # enforced by the hub reaper if the run stalls

states:
  prepare:
    description: Prepare the dependency-update branch.
    phase: build
    on_enter:
      effects:
        - exec.run:
            command: |
              bash -lc 'cd "$HOME/.openclaw/workspace" && bash scripts/prepare-deps-branch.sh xavpaice/pottery-shop main deps/dependency-update-go "[deps] Dependency update: go"'
            timeout: 10m

  prepare_failed:
    description: Branch preparation failed. Inspect the `exec.last_run` facts (stdout, stderr, error) for the reason, then trigger the workflow manually once it is resolved.
    phase: done
    terminal: true

  update_deps:
    description: Update Go dependencies.
    phase: build
    on_enter:
      effects:
        - dependency.update:
            ecosystems: [go]
            paths: [pottery-shop]
            timeout: 30m

  detect_changes:
    description: Detect whether dependency files changed.
    phase: build
    on_enter:
      effects:
        - exec.run:
            command: |
              bash -lc 'cd "$HOME/.openclaw/workspace" && bash scripts/detect-go-changes.sh pottery-shop | tee /tmp/detect.json; python3 -c "import json,sys; d=json.load(open(\"/tmp/detect.json\")); sys.exit(0 if d[\"status\"]==\"has_changes\" else 1)"'
            timeout: 15m

  no_changes:
    description: No dependency changes were detected. No further action is needed.
    phase: done
    terminal: true

  validate:
    description: Validate updated dependencies.
    phase: test
    on_enter:
      effects:
        - exec.run:
            command: |
              bash -lc '
                cd "$HOME/.openclaw/workspace" && set +e
                tmpdir="$(mktemp -d)"

                ( cd pottery-shop && make build >"$tmpdir/build.log" 2>&1 ) ; build_status=$?
                ( cd pottery-shop && make test >"$tmpdir/test.log" 2>&1 ) ; test_status=$?

                python3 - "$tmpdir" "$build_status" "$test_status" <<PY
              import json
              import pathlib
              import sys

              tmpdir = pathlib.Path(sys.argv[1])
              statuses = {
                  "build": int(sys.argv[2]),
                  "test": int(sys.argv[3]),
              }

              checks = []
              for name, code in statuses.items():
                  log = (tmpdir / f"{name}.log").read_text(errors="replace")
                  checks.append({
                      "name": name,
                      "status": "passed" if code == 0 else "failed",
                      "exit_code": code,
                      "log_tail": log[-12000:],
                  })

              failed = [check for check in checks if check["exit_code"] != 0]
              print(json.dumps({
                  "status": "passed" if not failed else "failed",
                  "reason": "all validation checks passed" if not failed else "one or more validation checks failed",
                  "checks": checks,
              }))
              PY
              '
            timeout: 45m

  fix_validation:
    description: Fix validation failures.
    phase: build
    on_enter:
      effects:
        - agent.task:
            prompt: |
              You are in the middle of an automated dependency update workflow for the pottery-shop project (`xavpaice/pottery-shop`).

              The Go repository is checked out in the `./pottery-shop` directory relative to the workspace root. Run all repo commands (`go`, `make`, `git`) from that directory.

              So far the workflow has:
              1. Prepared a branch (`deps/dependency-update-go`) using the `prepare-deps-branch.sh` script.
              2. Updated Go dependencies via the `dependency.update` effect, which may have changed `go.mod`, `go.sum`, and/or `vendor/` in the `pottery-shop` directory.
              3. Validated the updated dependencies by running `make build` and `make test`.

              Validation failed. One or more of those checks did not pass, usually because an updated dependency introduced a breaking change or incompatible API change in the Go module.

              Your task: fix the failures above with reasonable, scoped changes inside `./pottery-shop`. Treat these compatibility fixes as part of this dependency update workflow. Do not downgrade, pin, or skip an update just because it has breaking API changes unless the required changes are broad, risky, unrelated to this workflow's scope, or cannot be completed within reasonable effort.

              When the fixes are ready, commit them to the branch (`deps/dependency-update-go`) and run the `retry_validation` command.
            include_facts:
              - exec.last_run.stdout
              - exec.dependency_update.files_changed

  open_pr:
    description: Open the dependency-update PR.
    phase: pr
    on_enter:
      effects:
        - agent.task:
            prompt: |
              You are in the middle of an automated dependency update workflow for the pottery-shop project (`xavpaice/pottery-shop`).

              The Go repository is checked out in the `./pottery-shop` directory relative to the workspace root. Run all repo commands (`go`, `make`, `git`) from that directory.

              So far the workflow has:
              1. Prepared a branch (`deps/dependency-update-go`) using the `prepare-deps-branch.sh` script.
              2. Updated Go dependencies via the `dependency.update` effect, which changed dependency files in `pottery-shop`.
              3. Validated the updates by running `make build` and `make test` — all checks passed.

              Now open the grouped PR from the current branch. You are already on `deps/dependency-update-go` from the earlier preparation step.

              Requirements:
              - PR title: [deps] Dependency update: go
              - PR body must start with: "This PR was generated by the dependency-update-potteryshop Factory workflow."
              - Push the current branch.
              - If an open PR already exists from this workflow, the push will update it. If no open PR exists, create one.

              Run the `mark_pr_opened` command with the PR URL when the PR is raised or updated.
            include_facts:
              - exec.last_run.stdout
              - exec.dependency_update.files_changed
              - exec.dependency_update.updates

  pr_opened:
    description: PR is open; waiting for CI and reviews.
    phase: review
    on_enter:
      effects:
        - agent.task:
            prompt: |
              PR created. Watch for CI results and review comments.

              When CI is passing and reviews are clean, run the `mark_ready_to_merge` command.

  ready_to_merge:
    description: CI is green and reviews are clean. The PR is ready to merge; no further workflow action is needed.
    phase: review
    terminal: true

commands:
  retry_validation:
    from: fix_validation
    to: validate

  mark_pr_opened:
    from: open_pr
    to: pr_opened

  mark_ready_to_merge:
    from: pr_opened
    to: ready_to_merge

transitions:
  prepare_succeeded:
    from: prepare
    on: exec.run.completed
    when:
      exec:
        last_run:
          succeeded:
            equals: true
    to: update_deps

  prepare_failed:
    from: prepare
    on: exec.run.failed
    to: prepare_failed

  update_deps_succeeded:
    from: update_deps
    on: dependency.update.completed
    when:
      exec:
        dependency_update:
          succeeded:
            equals: true
    to: detect_changes

  update_deps_failed:
    from: update_deps
    on: dependency.update.failed
    to: prepare_failed

  changes_detected:
    from: detect_changes
    on: exec.run.completed
    to: validate

  no_changes_detected:
    from: detect_changes
    on: exec.run.failed
    to: no_changes

  validation_succeeded:
    from: validate
    on: exec.run.completed
    when:
      exec:
        last_run:
          succeeded:
            equals: true
    to: open_pr

  validation_failed:
    from: validate
    on: exec.run.failed
    to: fix_validation
